<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
    <div class="noise" aria-hidden="true"></div>
    <main class="login-wrap">
        <form class="login-card" method="post" action="/admin/login">
            <span class="mono-label">ADMIN // LOGIN</span>
            <h1>Portfolio CMS</h1>
            
            {% if error %}
            <p class="flash flash-error">{{ error }}</p>
            {% endif %}
            <label>
                Username
                <input type="text" name="username" required autocomplete="username">
            </label>
            <label>
                Password
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="contact-btn admin-btn">Sign in</button>
            <a class="back-link" href="/">← Back to site</a>
        </form>
    </main>
</body>
</html>
